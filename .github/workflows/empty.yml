name: Empty Repo

# MANUAL ONLY. Wipes the WHOLE repo: every tracked file is deleted and
# the deletion is committed, including zip files and the workflow files
# themselves. After it finishes, the repo contains zero files.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wipe:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Wipe whole repo
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git ls-files -z | xargs -0 -r git rm -q
          if git diff --cached --quiet; then
            echo "Repo is already empty."
          else
            git commit -m "Empty repo"
            git push origin "HEAD:${{ github.ref_name }}"
            echo "Done. Repo now contains zero files."
          fi
          
