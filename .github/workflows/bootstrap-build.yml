name: Build Orbit Board (from zip)

# Bootstrap build v5:
#  1. If the source is not in the repo yet, finds the single .zip
#     (whatever its name), unzips it into the root.
#  2. DELETES any workflow file that came out of the zip BEFORE the
#     push — the Actions robot is forbidden from pushing workflow
#     files, and that rejection killed the earlier runs. (This does
#     not touch bootstrap-build.yml itself.)
#  3. Verifies the spyware / voice / update removals.
#  4. Commits the unzipped source back into this repo.
#  5. Builds the stable release and uploads the APK as an artifact.
# After this run, create .github/workflows/build.yml by hand in the
# web UI and run it (the real "Build Orbit Board (Custom)" workflow).
# On later runs the source is already in the repo, so steps 1–4
# skip themselves and it simply builds.

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and unzip the codebase (first run only)
        run: |
          if [ -f settings.gradle ]; then
            echo "Source already in the repo — skipping unzip"
            exit 0
          fi
          ZIP=$(find . -maxdepth 2 -name "*.zip" -not -path "./.git/*" | sort | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "::error::No .zip file found in this repo and no source either"
            exit 1
          fi
          echo "Unzipping: $ZIP"
          unzip -o "$ZIP" -d .
          ls

      - name: Remove any workflow file that came out of the zip
        run: |
          rm -f .github/workflows/build.yml
          echo "Workspace workflow files now:"
          ls .github/workflows/ || echo "(none)"

      - name: Verify removed features are absent from source
        run: |
          set -e
          for p in \
            java/src/org/futo/inputmethod/updates \
            java/src/org/futo/inputmethod/announcements \
            java/src/org/futo/inputmethod/latin/capture \
            java/src/org/futo/inputmethod/latin/uix/voiceinput \
            java/src/org/futo/inputmethod/latin/uix/actions/VoiceInputAction.kt \
            java/src/org/futo/inputmethod/latin/uix/settings/pages/VoiceInput.kt \
            voiceinput-shared ; do
            if [ -e "$p" ]; then
              echo "::error::Removed path is present again: $p"
              exit 1
            fi
          done
          if grep -rq "web.ndpnt.co" java/src common/src; then
            echo "::error::Screenshot AI assistant endpoint found in source"
            exit 1
          fi
          if grep -rq "org.futo.voiceinput" java/src common/src; then
            echo "::error::Voice-input module reference found in source"
            exit 1
          fi
          echo "PASS: voice typing, updates, announcements, crash reporting and the screenshot AI assistant are absent."

      - name: Save the unzipped source into the repo (first run only)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -Af
          if git diff --cached --quiet; then
            echo "Source already committed, nothing to save"
          else
            git commit -m "Unzip Orbit Board custom source into repo"
            git push origin HEAD:${{ github.ref_name }}
            echo "Source saved to the repo"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK 34 + NDK
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;25.1.8937393" "ndk;25.2.9519653"

      - name: Build stable release
        run: |
          chmod +x gradlew
          ./gradlew assembleStableRelease --no-daemon

      - name: Verify APK permissions
        run: |
          APK=$(find build/outputs/apk/stable/release -name "*.apk" | head -n 1)
          echo "Permissions of: $APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt2" dump permissions "$APK"
          if "$ANDROID_HOME/build-tools/34.0.0/aapt2" dump permissions "$APK" | grep -q "android.permission.RECORD_AUDIO"; then
            echo "::error::RECORD_AUDIO found in the APK — voice typing removal did not apply."
            exit 1
          fi
          echo "PASS: no RECORD_AUDIO. INTERNET is expected (Cloud Translate, explicit tap only)."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: orbit-board-custom-apk
          path: build/outputs/apk/stable/release/*.apk
          if-no-files-found: error
          
